# MakerOps Labs funding links
# These power the "Sponsor" button on GitHub repository pages.
#
# TO ACTIVATE:
#   github:          Enroll at https://github.com/sponsors and set to your GitHub username or org name
#   ko_fi:           Set to your Ko-fi handle (the part after ko-fi.com/)
#   buy_me_a_coffee: Set to your Buy Me a Coffee handle (the part after buymeacoffee.com/)
#
# Copy this file to .github/FUNDING.yml in makerops-core and makerops-edge as well.

github: makerops-labs            # TODO: activate after enrolling at github.com/sponsors
ko_fi: your-handle               # TODO: replace with your Ko-fi handle
buy_me_a_coffee: your-handle     # TODO: replace with your Buy Me a Coffee handle
